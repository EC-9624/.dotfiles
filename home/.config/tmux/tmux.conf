# Prefix
set -g prefix C-Space
set -g prefix2 C-a
unbind C-b
bind C-Space send-prefix
bind C-a send-prefix -2

# Terminal-native palette
set -g @theme_base 'colour0'
set -g @theme_surface 'colour0'
set -g @theme_overlay 'colour8'
set -g @theme_muted 'colour8'
set -g @theme_subtle 'colour7'
set -g @theme_text 'default'
set -g @theme_love 'colour1'
set -g @theme_gold 'colour3'
set -g @theme_foam 'colour6'
set -g @theme_iris 'colour5'
set -g @theme_pine 'colour4'

set -g @status_left_fmt '#[fg=#{?client_prefix,#{@theme_love},#{@theme_foam}}] #[fg=#{@theme_text}]#S #[fg=#{@theme_subtle}] #(~/.config/tmux/scripts/current-path "#{pane_current_path}") #[fg=#{@theme_gold}]#(~/.config/tmux/scripts/git-branch "#{pane_current_path}")'
set -g @status_right_fmt '#[fg=#{@theme_foam}] #(~/.tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh) #[fg=#{@theme_iris}] #(~/.tmux/plugins/tmux-cpu/scripts/ram_percentage.sh) #[fg=#{@theme_gold}]#(~/.config/tmux/scripts/battery-status) #[fg=#{@theme_subtle}] %H:%M'
set -g @window_status_fmt ' #I#{?#{!=:#{window_name},Window},: #W,} '

# Terminal integration
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -s set-clipboard on
set -g focus-events on

# General behavior
set -g detach-on-destroy off
set -g history-limit 50000
set -sg escape-time 0
set -g mouse on
set -g status-interval 5
set -g status-justify absolute-centre
setw -g mode-keys vi

# Window and pane numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"
bind P run-shell '~/.tmux/plugins/tmux-palette/bin/tmux-palette.sh'
bind x kill-pane
bind m resize-pane -Z

# Split in current directory
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Equalize panes
bind = select-layout main-vertical 

# Floating tools in the current pane directory
# bind C-y display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "yazi"
bind C-g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"
bind C-t display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "zsh"

# Copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'eduwass/tmux-palette'
set -g @palette-key 'off'

# Terminal-native status line
set -g @cpu_percentage_format '%.0f%%'
set -g @ram_percentage_format '%.0f%%'

set -g status-position bottom
set -g status-style 'bg=default'
set -g status-left-length 100
set -g status-right-length 120

set -gF message-style 'fg=#{@theme_subtle},bg=default'
set -gF message-command-style 'fg=#{@theme_base},bg=#{@theme_gold}'

set -gF pane-border-style 'fg=#{@theme_overlay}'
set -gF pane-active-border-style 'fg=#{@theme_pine}'
setw -gF clock-mode-colour '#{@theme_love}'
setw -gF mode-style 'fg=#{@theme_base},bg=#{@theme_iris}'

set -gF status-left '#{@status_left_fmt}'
set -gF status-right '#{@status_right_fmt}'

set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

set -gF window-status-format '#{@window_status_fmt}'
set -gF window-status-style "bg=default,fg=#{@theme_muted}"
set -gF window-status-last-style "bg=default,fg=#{@theme_subtle}"

set -gF window-status-activity-style "bg=#{@theme_gold},fg=#{@theme_base},bold"
set -gF window-status-bell-style "bg=#{@theme_love},fg=#{@theme_base},bold"
set -gF window-status-separator "#[bg=default,fg=#{@theme_muted}]│"

set -gF window-status-current-format '#{@window_status_fmt}'
set -gF window-status-current-style "bg=#{@theme_gold},fg=#{@theme_base},bold"

# TPM bootstrap
run '~/.tmux/plugins/tpm/tpm'
